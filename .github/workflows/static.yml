# Deploys the repository, including the expBuilder_Widget demo, to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["integration"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject what3words API key into the demo config
        env:
          W3W_API_KEY: ${{ secrets.W3W_DEMO_API_KEY }}
        run: |
          if [ -z "$W3W_API_KEY" ]; then
            echo "::error::W3W_DEMO_API_KEY secret is not set"
            exit 1
          fi
          sed -i "s|__W3W_API_KEY__|$W3W_API_KEY|g" expBuilder_Widget/cdn/1/config.json expBuilder_Widget/cdn/1/resources/config/config.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
