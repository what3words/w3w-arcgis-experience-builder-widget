# Builds the expBuilder_Widget demo with ArcGIS Experience Builder and deploys it, with the README and docs, to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # corepack provides the pnpm version Experience Builder pins in its packageManager field
      - name: Build the demo app
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack enable
          scripts/build-demo.sh
      - name: Inject what3words API key into the demo config
        env:
          W3W_API_KEY: ${{ secrets.W3W_DEMO_API_KEY }}
        run: |
          if [ -z "$W3W_API_KEY" ]; then
            echo "::error::W3W_DEMO_API_KEY secret is not set"
            exit 1
          fi
          sed -i "s|__W3W_API_KEY__|$W3W_API_KEY|g" expBuilder_Widget/cdn/1/config.json expBuilder_Widget/cdn/1/resources/config/config.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # Renders README.md as the site root, as the previous branch-based Pages build did
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
